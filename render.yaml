# Render blueprint for docnova.co.uk (web service + a small private disk for orders, subscribers and Rounds)
services:
  - type: web
    name: docnova
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: docnova-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DOCNOVA_DATA_DIR
        value: /var/data
      - key: DOCNOVA_PUBLIC_URL
        value: https://docnova.co.uk
      # "1" = card payment off (WhatsApp ordering instead). "0" = live card checkout (opened 29 Sep 2026 once the live key was in Render)
      - key: DOCNOVA_CHECKOUT_PAUSED
        value: "0"
      - key: GOOGLE_PLACE_ID
        value: ChIJsYc-YLZng2URQNsyBvUhTec
      # Private values — entered in the Render dashboard, never stored in GitHub:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DOCNOVA_STRIPE_LIVE
        sync: false
      - key: DOCNOVA_PRIVATE_CODES
        sync: false
      - key: DOCNOVA_SMTP_HOST
        sync: false
      - key: DOCNOVA_SMTP_PORT
        sync: false
      - key: DOCNOVA_SMTP_USER
        sync: false
      - key: DOCNOVA_SMTP_PASSWORD
        sync: false
      - key: DOCNOVA_FROM_EMAIL
        sync: false
